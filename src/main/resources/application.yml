spring:
  application:
    name: keycloak-auth-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${app.keycloak.serverUrl}/realms/${app.keycloak.realm}
          jwk-set-uri: ${app.keycloak.serverUrl}/realms/${app.keycloak.realm}/protocol/openid-connect/certs
server:
  port: ${PORT:6700}  # Railway PORT env var'ını kullan, yoksa 6700

logging:
  level:
    root: INFO
    com.keycloak.keycloak_auth_service.config.CustomCorsFilter: DEBUG  # CORS filter logları
  file:
    name: keycloak.log  # Log dosyası
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  keycloak:
    admin:
      # psikohekim-frontend: realm'deki public client (directAccessGrantsEnabled)
      clientId: psikohekim-frontend
      clientSecret:   # public client - secret yok
      adminClientId: admin-cli
      adminClientSecret: 48nB8sqCaphu6DoHi2zWwqopwZ281Ql1
    realm: psikohekim
    serverUrl: http://localhost:8080