# Keycloak Projesi: Keycloak imajı + keycloak-auth-service (Spring Boot)
# auth.iyihislerapp.com → Nginx → keycloak-auth-service:6700
# keycloak-auth-service → Keycloak:8080 (internal)
# Kullanım: cd Keycloak && docker compose -f docker-compose/docker-compose.yml --env-file .env up -d --build

services:
  postgres:
    image: postgres:16
    container_name: keycloak-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak} -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: keycloak
    command: start --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      # Local: http://localhost:8080 | Prod: https://auth.iyihislerapp.com
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8080}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    volumes:
      - ../realm-import/psikohekim-realm.json:/opt/keycloak/data/import/psikohekim-realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  keycloak-auth-service:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: keycloak-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 6700
      # Keycloak: sunucuda 1-keycloak network'ündeki keycloak'a erişim için
      APP_KEYCLOAK_SERVER_URL: ${APP_KEYCLOAK_SERVER_URL:-http://keycloak:8080}
      # JWT issuer: token'daki issuer ile eşleşmeli (KEYCLOAK_HOSTNAME kullanır)
      APP_JWT_ISSUER_URI: ${APP_JWT_ISSUER_URI:-https://auth.iyihislerapp.com/realms/psikohekim}
      # admin-cli client secret (master realm → admin-cli → Client authentication ON → Credentials)
      APP_KEYCLOAK_ADMIN_ADMINCLIENTSECRET: ${APP_KEYCLOAK_ADMIN_ADMINCLIENTSECRET:-48nB8sqCaphu6DoHi2zWwqopwZ281Ql1}
    ports:
      - "6700:6700"
    depends_on:
      keycloak:
        condition: service_started
    restart: unless-stopped
    # Sunucuda keycloak 1-keycloak_default network'ünde - bu network'e bağlan (rebuild sonrası da kalıcı)
    networks:
      - keycloak_external

networks:
  keycloak_external:
    external: true
    name: 1-keycloak_default

volumes:
  keycloak_pgdata:
