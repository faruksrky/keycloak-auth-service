# Keycloak - auth.iyihislerapp.com (Cloudflare Full SSL)
# Cloudflare Full: Cloudflare <--HTTPS--> Origin (port 443)
# Önce: Cloudflare Origin Certificate oluştur, sunucuya kopyala

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      https;
}

# HTTP -> HTTPS yönlendirme
server {
    listen 80;
    server_name auth.iyihislerapp.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl default_server;
    server_name auth.iyihislerapp.com;

    # Cloudflare Origin Certificate (Dashboard'dan oluştur)
    ssl_certificate /etc/ssl/cloudflare/auth.iyihislerapp.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/auth.iyihislerapp.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_redirect http://auth.iyihislerapp.com:8080/ https://auth.iyihislerapp.com/;
        proxy_redirect http://$host:8080/ https://$host/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
